<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch DXF Key Generator</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#d8dce3; --accent:#1f6feb; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#181c24; --fg:#e6e9ef; --muted:#9aa3b2; --line:#2c3340; --accent:#4c8dff; --ok:#3ccf6e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width:560px; margin:32px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:13px; }
  label { display:block; font-weight:600; font-size:13px; margin:14px 0 6px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); font:inherit; }
  input#dev { font-family:ui-monospace, Consolas, monospace; text-transform:uppercase; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .out { margin-top:18px; padding:16px; border:1px dashed var(--line); border-radius:10px; text-align:center; }
  .key { font:700 26px/1.2 ui-monospace, Consolas, monospace; letter-spacing:1px; word-break:break-all; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  .copied { color:var(--ok); }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:14px; }
  td { padding:6px 4px; border-top:1px solid var(--line); }
  td.k { font-family:ui-monospace, Consolas, monospace; text-align:right; }
  details { margin-top:16px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Sketch DXF — Activation Key Generator</h1>
    <p class="sub">Private tool. Matches <code>License.activationKey()</code> in the app (HMAC-SHA256, first 16 hex, dashed in 4s).</p>

    <label for="dev">Customer Device ID</label>
    <input id="dev" placeholder="e.g. 1A2B3C4D5E6F7A8B" autocomplete="off" spellcheck="false">

    <label for="ms">Plan / renewal point</label>
    <select id="ms">
      <option value="1">1 month — first activation (end of trial)</option>
      <option value="6">6 months renewal</option>
      <option value="12">12 months renewal</option>
      <option value="36">36 months renewal</option>
      <option value="48">48 months renewal</option>
    </select>

    <div class="out">
      <div class="key" id="key">—</div>
      <div class="hint" id="hint">Enter a Device ID</div>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="copy">Copy key</button>
      <button id="wa" class="ghost">Send via WhatsApp</button>
    </div>

    <table id="all" hidden></table>

    <details>
      <summary>Secret (must match SECRET in License.kt)</summary>
      <label for="sec">Secret</label>
      <input id="sec" value="SKDXF-change-this-secret-2026" spellcheck="false">
    </details>
  </div>
</main>

<script>
// Pure-JS SHA-256 / HMAC so it works from file:// without crypto.subtle.
function sha256(bytes) {
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[len] = 0x80;
  const bits = len * 8; const dv = new DataView(m.buffer);
  dv.setUint32(total - 8, Math.floor(bits / 0x100000000)); dv.setUint32(total - 4, bits >>> 0);
  const w = new Uint32Array(64);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0]+=a; H[1]+=b; H[2]+=c; H[3]+=d; H[4]+=e; H[5]+=f; H[6]+=g; H[7]+=h;
  }
  const out = new Uint8Array(32); const odv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i]);
  return out;
}
function hmacHex(secret, msg) {
  const enc = new TextEncoder();
  let key = enc.encode(secret);
  if (key.length > 64) key = sha256(key);
  const k = new Uint8Array(64); k.set(key);
  const ipad = k.map(b => b ^ 0x36), opad = k.map(b => b ^ 0x5c);
  const m = enc.encode(msg);
  const inner = new Uint8Array(64 + m.length); inner.set(ipad); inner.set(m, 64);
  const ih = sha256(inner);
  const outer = new Uint8Array(96); outer.set(opad); outer.set(ih, 64);
  return Array.from(sha256(outer), b => b.toString(16).padStart(2, '0')).join('');
}
// Mirror of License.activationKey(deviceId, milestone)
function activationKey(secret, deviceId, milestone) {
  const id = deviceId.trim().toUpperCase();
  const message = milestone <= 1 ? id : id + milestone;
  return hmacHex(secret, message).slice(0, 16).toUpperCase().match(/.{4}/g).join('-');
}

const $ = id => document.getElementById(id);
const PLANS = [1, 6, 12, 36, 48];
function update() {
  const dev = $('dev').value.trim(), sec = $('sec').value, ms = +$('ms').value;
  if (!dev) { $('key').textContent = '—'; $('hint').textContent = 'Enter a Device ID'; $('all').hidden = true; return; }
  $('key').textContent = activationKey(sec, dev, ms);
  $('hint').className = 'hint';
  $('hint').textContent = 'Device ' + dev.toUpperCase() + ' · ' + ms + ' month' + (ms > 1 ? 's' : '');
  $('all').innerHTML = PLANS.map(p => '<tr><td>' + p + ' month' + (p > 1 ? 's' : '') + '</td><td class="k">' + activationKey(sec, dev, p) + '</td></tr>').join('');
  $('all').hidden = false;
}
['dev', 'ms', 'sec'].forEach(id => $(id).addEventListener('input', update));
$('copy').onclick = async () => {
  const k = $('key').textContent; if (k === '—') return;
  try { await navigator.clipboard.writeText(k); } catch (e) {
    const t = document.createElement('textarea'); t.value = k; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  $('hint').className = 'hint copied'; $('hint').textContent = 'Copied ' + k;
};
$('wa').onclick = () => {
  const k = $('key').textContent; if (k === '—') return;
  const text = 'Your Sketch DXF activation key: ' + k;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
};
</script>
</body>
</html>
