name: Build APK + AAB

# Every push to main builds a debug APK and a release AAB, both signed with the committed
# "stable" key (see app/build.gradle.kts), so a signed installable APK and a Play-ready AAB
# are available after every commit with no secrets setup required.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (8.13)
        # Generated in a scratch directory: running the runner's own Gradle inside this
        # project would configure it, and that Gradle is too new for our AGP.
        run: |
          mkdir -p /tmp/wrapgen
          touch /tmp/wrapgen/settings.gradle
          cd /tmp/wrapgen && gradle wrapper --gradle-version 8.13
          cp -r /tmp/wrapgen/gradle/wrapper/gradle-wrapper.jar $GITHUB_WORKSPACE/gradle/wrapper/
          cp /tmp/wrapgen/gradlew /tmp/wrapgen/gradlew.bat $GITHUB_WORKSPACE/
          chmod +x $GITHUB_WORKSPACE/gradlew

      - name: Compute version code
        # Always increasing, so a debug APK installs as an upgrade over the previous one.
        run: echo "VERSION_CODE=$(( ${{ github.run_number }} + 1000 ))" >> "$GITHUB_ENV"

      - name: Build debug APK + release AAB
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug bundleRelease --stacktrace 2>&1 | tee build-log.txt

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buildlog-${{ github.run_number }}
          name: Build log ${{ github.run_number }}
          files: build-log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sketchdxf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sketchdxf-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish APK + AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sketch DXF v${{ github.run_number }}
          body: |
            Built automatically from commit ${{ github.sha }}.
            app-debug.apk installs directly on an Android device.
            app-release.aab is a signed App Bundle, ready to upload to Google Play.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
